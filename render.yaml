services:
  - type: web
    name: live-stream-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn live:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLATFORM
        value: facebook
      - key: VIDEO_FILE
        value: video_optimized.mp4
